id: rect-at
severity: hint
message: "collision_rectangle at an instance's x / y plus whole offsets (prec 0, noone): collision_rect_at (the instance) or collision_rect_any_at (!= noone) take the corners on ints at a whole x, y"
note: "branch floatcol: at a whole x, y (|.| < 29900) the corners PTOD(x) + l, ... are whole doubles (|l| < 100), which collision_rect_p's far test (dfloor14) and rq_init's whole path read as these ints; collision_rect_at makes those steps on the ints, else calls collision_rect_p on the same doubles. collision_rect_any is collision_rect_p != NOONE (its oSolid path: rect_any_i on the same ints). tools/sgfix_at.py rect-at rewrites"
language: c
files: ["src/**"]
rule:
  any:
    - pattern: "collision_rect_p(X($I), Y($I), X($I), Y($I), $O, 0, NOONE)"
    - pattern: "collision_rect_any(X($I), Y($I), X($I), Y($I), $O, 0, NOONE)"
    - pattern: "collision_rect_p(X($I), Y($I), X($I), Y($I) + $B, $O, 0, NOONE)"
    - pattern: "collision_rect_any(X($I), Y($I), X($I), Y($I) + $B, $O, 0, NOONE)"
