id: cp-at-p
severity: hint
message: "collision_point at PTOD(p->x) / PTOD(p->y) plus int offsets, p = &PX(i): collision_point_any_at(i, dx, dy, obj)"
note: "branch floatcol: as cp-at, with the instance's x / y read through a struct pin pointer P; tools/sgfix_at.py cp-at-p resolves P to i from the enclosing function's one `struct pin *P = &PX(i);` (P and i not assigned again there) and rewrites"
language: c
files: ["src/game/**"]
rule:
  any:
    - pattern: "CP(PTOD($P->x), PTOD($P->y), $O)"
    - pattern: "CPn(PTOD($P->x), PTOD($P->y), $O, $S)"
    - pattern: "collision_point_any(PTOD($P->x), PTOD($P->y), $O, 0, NOONE)"
    - pattern: "collision_point_p(PTOD($P->x), PTOD($P->y), $O, 0, NOONE) != NOONE"
    - pattern: "collision_point_p(PTOD($P->x), PTOD($P->y), $O, 0, NOONE) == NOONE"
    - pattern: "CP(PTOD($P->x), PTOD($P->y) + $DY, $O)"
    - pattern: "CPn(PTOD($P->x), PTOD($P->y) + $DY, $O, $S)"
    - pattern: "collision_point_any(PTOD($P->x), PTOD($P->y) + $DY, $O, 0, NOONE)"
    - pattern: "collision_point_p(PTOD($P->x), PTOD($P->y) + $DY, $O, 0, NOONE) != NOONE"
    - pattern: "collision_point_p(PTOD($P->x), PTOD($P->y) + $DY, $O, 0, NOONE) == NOONE"
    - pattern: "CP(PTOD($P->x), PTOD($P->y) - $DY, $O)"
    - pattern: "CPn(PTOD($P->x), PTOD($P->y) - $DY, $O, $S)"
    - pattern: "collision_point_any(PTOD($P->x), PTOD($P->y) - $DY, $O, 0, NOONE)"
    - pattern: "collision_point_p(PTOD($P->x), PTOD($P->y) - $DY, $O, 0, NOONE) != NOONE"
    - pattern: "collision_point_p(PTOD($P->x), PTOD($P->y) - $DY, $O, 0, NOONE) == NOONE"
    - pattern: "CP(PTOD($P->x) + $DX, PTOD($P->y), $O)"
    - pattern: "CPn(PTOD($P->x) + $DX, PTOD($P->y), $O, $S)"
    - pattern: "collision_point_any(PTOD($P->x) + $DX, PTOD($P->y), $O, 0, NOONE)"
    - pattern: "collision_point_p(PTOD($P->x) + $DX, PTOD($P->y), $O, 0, NOONE) != NOONE"
    - pattern: "collision_point_p(PTOD($P->x) + $DX, PTOD($P->y), $O, 0, NOONE) == NOONE"
    - pattern: "CP(PTOD($P->x) + $DX, PTOD($P->y) + $DY, $O)"
    - pattern: "CPn(PTOD($P->x) + $DX, PTOD($P->y) + $DY, $O, $S)"
    - pattern: "collision_point_any(PTOD($P->x) + $DX, PTOD($P->y) + $DY, $O, 0, NOONE)"
    - pattern: "collision_point_p(PTOD($P->x) + $DX, PTOD($P->y) + $DY, $O, 0, NOONE) != NOONE"
    - pattern: "collision_point_p(PTOD($P->x) + $DX, PTOD($P->y) + $DY, $O, 0, NOONE) == NOONE"
    - pattern: "CP(PTOD($P->x) + $DX, PTOD($P->y) - $DY, $O)"
    - pattern: "CPn(PTOD($P->x) + $DX, PTOD($P->y) - $DY, $O, $S)"
    - pattern: "collision_point_any(PTOD($P->x) + $DX, PTOD($P->y) - $DY, $O, 0, NOONE)"
    - pattern: "collision_point_p(PTOD($P->x) + $DX, PTOD($P->y) - $DY, $O, 0, NOONE) != NOONE"
    - pattern: "collision_point_p(PTOD($P->x) + $DX, PTOD($P->y) - $DY, $O, 0, NOONE) == NOONE"
    - pattern: "CP(PTOD($P->x) - $DX, PTOD($P->y), $O)"
    - pattern: "CPn(PTOD($P->x) - $DX, PTOD($P->y), $O, $S)"
    - pattern: "collision_point_any(PTOD($P->x) - $DX, PTOD($P->y), $O, 0, NOONE)"
    - pattern: "collision_point_p(PTOD($P->x) - $DX, PTOD($P->y), $O, 0, NOONE) != NOONE"
    - pattern: "collision_point_p(PTOD($P->x) - $DX, PTOD($P->y), $O, 0, NOONE) == NOONE"
    - pattern: "CP(PTOD($P->x) - $DX, PTOD($P->y) + $DY, $O)"
    - pattern: "CPn(PTOD($P->x) - $DX, PTOD($P->y) + $DY, $O, $S)"
    - pattern: "collision_point_any(PTOD($P->x) - $DX, PTOD($P->y) + $DY, $O, 0, NOONE)"
    - pattern: "collision_point_p(PTOD($P->x) - $DX, PTOD($P->y) + $DY, $O, 0, NOONE) != NOONE"
    - pattern: "collision_point_p(PTOD($P->x) - $DX, PTOD($P->y) + $DY, $O, 0, NOONE) == NOONE"
    - pattern: "CP(PTOD($P->x) - $DX, PTOD($P->y) - $DY, $O)"
    - pattern: "CPn(PTOD($P->x) - $DX, PTOD($P->y) - $DY, $O, $S)"
    - pattern: "collision_point_any(PTOD($P->x) - $DX, PTOD($P->y) - $DY, $O, 0, NOONE)"
    - pattern: "collision_point_p(PTOD($P->x) - $DX, PTOD($P->y) - $DY, $O, 0, NOONE) != NOONE"
    - pattern: "collision_point_p(PTOD($P->x) - $DX, PTOD($P->y) - $DY, $O, 0, NOONE) == NOONE"
constraints:
  DX: { regex: '^(\d+|\(spr[wh]\(\w+\) >> 1\)|\(giant \? \d+ : \d+\))$' }
  DY: { regex: '^(\d+|\(spr[wh]\(\w+\) >> 1\)|\(giant \? \d+ : \d+\))$' }
