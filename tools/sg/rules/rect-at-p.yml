id: rect-at-p
severity: hint
message: "collision_rectangle at PTOD(p->x) / PTOD(p->y) plus int offsets (prec 0, noone), p = &PX(i): collision_rect_at / collision_rect_any_at"
note: "branch floatcol: as rect-at, with the instance's x / y read through a struct pin pointer P; tools/sgfix_at.py rect-at-p resolves P to i from the enclosing function's one `struct pin *P = &PX(i);` (P and i not assigned again there) and rewrites"
language: c
files: ["src/game/**"]
