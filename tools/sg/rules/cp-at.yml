id: cp-at
severity: hint
message: "collision_point at an instance's x / y plus constants for a static-index object: collision_point_any_at(i, dx, dy, obj) answers a miss from the index's cell counts at whole x, y (no double sums)"
note: "PERF3 batches 21-22; pworld.c xf_obj: oLava, oWater (oWaterSwim), oLadder, oLadderTop, oSpikes, oWeb, oTree / oLeaves. For other objects the _at form ends in the same collision_point_any. X(i) is PTOD(PX(i).x) in every file that defines it; dx, dy must be ints"
language: c
files: ["src/**"]
rule:
  any:
    - pattern: collision_point_any(PTOD($P->x) + $DX, PTOD($P->y) + $DY, $O, 0, NOONE)
    - pattern: collision_point_any(X($I) + $DX, Y($I) + $DY, $O, 0, NOONE)
    - pattern: CP(X($I) + $DX, Y($I) + $DY, $O)
    - pattern: CP(X($I) - $DX, Y($I) + $DY, $O)
    - pattern: CP(X($I) + $DX, Y($I) - $DY, $O)
    - pattern: CP(X($I) - $DX, Y($I) - $DY, $O)
    - pattern: CP(X($I), Y($I) + $DY, $O)
    - pattern: CP(X($I), Y($I) - $DY, $O)
    - pattern: CP(X($I) + $DX, Y($I), $O)
    - pattern: CP(X($I) - $DX, Y($I), $O)
    - pattern: CP(X($I), Y($I), $O)
constraints:
  O:
    regex: '^OBJ_o(Water|WaterSwim|Lava|Ladder|LadderTop|Spikes|Web|Tree|Leaves)$'
