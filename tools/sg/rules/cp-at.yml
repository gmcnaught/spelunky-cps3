    - pattern: "CP(PTOD(PX($I).x), PTOD(PX($I).y) - $DY, $O)"
    - pattern: "CPn(PTOD(PX($I).x), PTOD(PX($I).y) - $DY, $O, $S)"
    - pattern: "collision_point_any(PTOD(PX($I).x), PTOD(PX($I).y) - $DY, $O, 0, NOONE)"
    - pattern: "collision_point_p(PTOD(PX($I).x), PTOD(PX($I).y) - $DY, $O, 0, NOONE) != NOONE"
    - pattern: "collision_point_p(PTOD(PX($I).x), PTOD(PX($I).y) - $DY, $O, 0, NOONE) == NOONE"
    - pattern: "CP(PTOD(PX($I).x) + $DX, PTOD(PX($I).y), $O)"
    - pattern: "CPn(PTOD(PX($I).x) + $DX, PTOD(PX($I).y), $O, $S)"
